services:
  - type: web
    name: dlms-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: "*"
      # Set the rest in the Render dashboard (secrets):
      # FIREBASE_SERVICE_ACCOUNT_JSON, FIREBASE_PROJECT_ID,
      # FIREBASE_STORAGE_BUCKET, GOOGLE_BOOKS_API_KEY, CRON_SECRET,
      # SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_DIGITAL_BOOKS_BUCKET
